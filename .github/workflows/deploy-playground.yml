name: Deploy playground

# Deploys the dogfooding application to Cloudflare Pages. Deliberately separate from
# publishing: a website going out has nothing to do with a package going to npm, and
# coupling them means one cannot be rolled back without the other.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-playground
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Cloudflare Pages
    # Only from a healthy main. A dispatch is a deliberate act and runs regardless.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Nothing about the account is in
    # the repository - a fork deploys to its own account by setting its own secrets.
    environment: cloudflare-playground
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm run build --filter='./packages/*'

      - name: Build the playground for Cloudflare
        run: pnpm --filter @etyma/playground run build:cloudflare

      # Wrangler directly, not the Cloudflare dashboard's Git integration: the build that
      # is deployed is the one this workflow produced and CI already tested.
      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/playground
          command: pages deploy --branch=main
