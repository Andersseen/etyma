name: Release

# Fully automated Changesets flow: every push to `main` either opens or updates the
# "release: version packages" pull request (when there are pending changesets) or publishes
# to npm (when there is nothing left to version, which is exactly the state right after that
# pull request gets merged). Merging the version pull request is still the release decision -
# that review is the whole point of Changesets - but nothing after the merge needs a separate
# manual dispatch.
#
# Two jobs, not one, so the actual `npm publish` keeps living in publish.yml under its own
# name: npm's Trusted Publishing binding for @etyma/core, @etyma/angular and @etyma/analog is
# keyed to that exact workflow filename, and a called reusable workflow's OIDC token still
# identifies itself by the *called* file - so this can trigger a publish without anyone
# touching npmjs.com to re-bind it to a different filename.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Open or update the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Changesets
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm run version-packages
          pr-title: 'release: version packages'
          commit-message: 'release: version packages'
          # No `publish` input here on purpose - see the `publish` job below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish the version already on main
    needs: version
    # `has-changesets` is "false" exactly when there was nothing to open or update a version
    # pull request for - either main has no pending changesets and nothing to publish either
    # (a normal commit), or the version pull request was just merged and its bump is sitting
    # on main unpublished. `pnpm run release` (called inside publish.yml) is a no-op for the
    # former case, so this only needs to skip when there *are* pending changesets to review
    # first.
    if: needs.version.outputs.has-changesets == 'false'
    # The effective permission ceiling for a called reusable workflow is the intersection of
    # what it asks for and what the calling job grants - the top-level `contents: read`
    # above would otherwise cap it, and publish.yml's own `publish` job needs `id-token:
    # write` for OIDC (harmless to grant even on the token path below).
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      # OIDC failed with ENEEDAUTH on the first automatic run - most likely because no
      # package has an npm Trusted Publisher bound yet (unprovable from this repo; see
      # RELEASING.md). Using the bootstrap NPM_TOKEN instead needs no npmjs.com
      # configuration, so the automatic path - the whole point of this workflow - works
      # today rather than blocking on an account setting only npmjs.com can confirm. Once
      # Trusted Publisher is bound for every package this releases, flip this back to
      # `true` and the token can be revoked, per RELEASING.md's "Switching to OIDC".
      use-oidc: false
      dry-run: false
    secrets: inherit
