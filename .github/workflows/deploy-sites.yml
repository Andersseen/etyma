name: Deploy sites

# Deploys the official website and the dogfooding playground to Cloudflare Pages.
# Deliberately separate from publishing: a website going out has nothing to do with a
# package going to npm, and coupling them means one cannot be rolled back without the other.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-sites
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ matrix.name }}
    # Only from a healthy main. A dispatch is a deliberate act and runs regardless.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Official website
            package: '@etyma/www'
            path: apps/www
            environment: cloudflare-www
            url: https://etyma.andersseen.dev
          - name: Playground
            package: '@etyma/playground'
            path: apps/playground
            environment: cloudflare-playground
            url: https://etyma-playground.pages.dev
    # Creates GitHub Deployments for the repo sidebar. CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID are repository secrets, so forks can deploy to their own
    # accounts by defining their own values.
    environment:
      name: ${{ matrix.environment }}
      url: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm run build --filter='./packages/*'

      - name: Build ${{ matrix.name }} for Cloudflare
        run: pnpm --filter ${{ matrix.package }} run build:cloudflare

      # Wrangler directly, not the Cloudflare dashboard's Git integration: the build that
      # is deployed is the one this workflow produced and CI already tested.
      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.path }}
          command: pages deploy --branch=main
