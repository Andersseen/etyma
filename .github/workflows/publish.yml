name: Publish

# Publishes every @etyma package with a pending version bump to npm - the runtime trio
# (@etyma/core, @etyma/angular, @etyma/analog), released together, and @etyma/tooling, which
# versions independently. `changeset publish` only publishes packages a merged changeset
# actually bumped, so a runtime-only release does not touch tooling and vice versa.
#
# Runs two ways:
#   - Called automatically by release.yml, right after it finds nothing left to version -
#     which is exactly the state right after a "release: version packages" pull request gets
#     merged. Merging that pull request is the release decision; nothing after it needs a
#     separate click.
#   - Dispatched manually, for a dry run or for the one case automation cannot do on its
#     own: a package publishing for the very first time, which needs `use-oidc: false` and a
#     bootstrap token - see RELEASING.md.
#
# Either way it re-runs the full quality gates first: the commit being published is what
# will be on npm forever, and trusting a green run from an earlier commit is how a broken
# package gets published.
#
# Authentication moved in two stages - see RELEASING.md:
#   0.1.0  used a granular NPM_TOKEN in the protected `npm-publish` environment, because
#          npm Trusted Publishing cannot be configured for a package that does not exist.
#   after  OIDC is preferred, with the token revoked once every @etyma package has this
#          workflow registered as its trusted publisher.

on:
  workflow_dispatch:
    inputs:
      use-oidc:
        description: 'Publish with npm Trusted Publishing (OIDC) instead of NPM_TOKEN'
        type: boolean
        default: true
      dry-run:
        description: 'Run every gate and pack the tarballs, but do not publish'
        type: boolean
        default: false
  # Called by release.yml right after it finds nothing left to version - i.e. right after a
  # "release: version packages" pull request has been merged. Kept as its own file, not
  # inlined into release.yml, because npm's Trusted Publishing binding is keyed to this exact
  # workflow filename: a called reusable workflow's OIDC token still identifies itself as
  # `publish.yml`, so the existing binding for @etyma/core, @etyma/angular and @etyma/analog
  # keeps working without anyone touching npmjs.com.
  workflow_call:
    inputs:
      use-oidc:
        type: boolean
        default: true
      dry-run:
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run package:check
      - run: pnpm run compat:check

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A protected environment is what holds the bootstrap token and, if configured, a
    # required reviewer. Both stages run through it.
    environment: npm-publish
    permissions:
      contents: read
      # Provenance attestations are signed with this even when the registry credential is
      # still a token, so 0.0.1 is provenance-backed too.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1, which is newer than the npm bundled with
      # Node 22. Upgrading unconditionally keeps both paths on one CLI.
      - name: Use an npm that understands trusted publishing
        run: npm install --global npm@latest

      # `registry-url` above always writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # to .npmrc, even when NODE_AUTH_TOKEN is deliberately empty for OIDC - see
      # https://github.com/actions/setup-node/issues/1551. `npm publish` itself is OIDC-aware
      # enough to fall through to Trusted Publishing regardless, but plain read commands - the
      # registry lookups `changeset publish` runs first to compute what needs publishing - are
      # not, and sending an empty bearer token on those reads produces a response Changesets'
      # parsing does not expect (a `TypeError` while planning, before anything is published).
      # Stripping the line for the OIDC path only removes the ambiguity for both.
      - name: Remove the empty auth token line so OIDC actually triggers
        if: ${{ inputs.use-oidc }}
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build --filter='./packages/*'

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: pnpm run release
        env:
          # Empty when publishing through OIDC. npm ignores an empty token and falls back to
          # the workflow's identity, which is what Trusted Publishing checks.
          NODE_AUTH_TOKEN: ${{ inputs.use-oidc && '' || secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: pnpm run package:check
